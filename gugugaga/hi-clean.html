<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f7f7f4">
<title>個人行程與任務管理系統</title>
<style>
:root{--ink:#222a25;--muted:#858b83;--line:#eceee8;--paper:#fff;--canvas:#f7f7f4;--green:#527b61;--green-dark:#355a43;--green-soft:#edf4ed;--peach:#f8eee5;--lavender:#f0eef8;--yellow:#faf3df;--shadow:0 10px 32px rgba(43,57,46,.055);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--canvas);font-size:14px}button,input{font:inherit}button{color:inherit}.app{min-height:100vh}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(32px,calc((100vw - 1240px)/2));background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}
.brand{font-size:14px!important}.language-select{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff;color:var(--green-dark);font-weight:650;cursor:pointer}.top-right{gap:14px!important}.top-date{display:none} .tool-button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;font-size:11px;cursor:pointer}.tool-button:hover{background:var(--green-soft)}
.event-actions{display:flex;gap:5px}.event-actions button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px}.schedule-empty,.tasks-empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:13px}.date-picker{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;padding:3px;color:var(--green-dark);background:white;cursor:pointer}
.form-dialog{width:min(440px,calc(100vw - 32px));border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--ink);box-shadow:var(--shadow)}.form-dialog::backdrop{background:rgba(28,37,30,.35);backdrop-filter:blur(2px)}.form-dialog h2{margin:0 0 18px;font-size:19px}.form-field{display:grid;gap:6px;margin:13px 0}.form-field label{font-size:12px;font-weight:650;color:#687167}.form-field input,.form-field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:white;color:var(--ink)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.dialog-actions button{border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:#fff;cursor:pointer}.dialog-actions .save-button{border-color:var(--green);background:var(--green);color:white}

.brand{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:750;letter-spacing:.02em}.brand-mark{width:36px;height:36px;display:grid;place-items:center;background:var(--green);color:white;border-radius:12px;font-size:19px}.top-right{display:flex;align-items:center;gap:25px}.top-date{color:var(--muted);font-size:13px}.avatar{width:36px;height:36px;display:grid;place-items:center;background:#e5eee5;border:2px solid white;border-radius:50%;color:var(--green-dark);font-weight:700;box-shadow:0 0 0 1px var(--line)}
main{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:39px 0 56px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:27px}.eyebrow{margin:0 0 7px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.12em}h1{margin:0;font-size:clamp(25px,3vw,32px);line-height:1.35;letter-spacing:-.035em}.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}.primary-button{display:inline-flex;align-items:center;gap:8px;border:0;padding:11px 17px;border-radius:10px;background:var(--green);color:white;font-weight:650;cursor:pointer;box-shadow:0 4px 12px rgba(82,123,97,.17);transition:background .18s,transform .18s}.primary-button:hover{background:var(--green-dark);transform:translateY(-1px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}.stat-card{display:flex;align-items:center;gap:15px;padding:18px 21px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat-icon{width:41px;height:41px;display:grid;place-items:center;border-radius:12px;font-size:19px}.stat-icon.green{background:var(--green-soft)}.stat-icon.peach{background:var(--peach)}.stat-icon.lavender{background:var(--lavender)}.stat-label{margin:0 0 3px;color:var(--muted);font-size:12px}.stat-value{margin:0;font-size:20px;font-weight:750;letter-spacing:-.03em}.stat-value small{color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}
.content-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:20px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-header{min-height:75px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.panel-title{margin:0;font-size:16px;font-weight:750}.panel-subtitle{margin:4px 0 0;color:var(--muted);font-size:12px}.date-nav{display:flex;align-items:center;gap:11px}.date-label{min-width:99px;text-align:center;font-size:12px;font-weight:650}.icon-button{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);background:white;border-radius:8px;cursor:pointer;color:#626a62}.icon-button:hover{background:var(--green-soft)}
.schedule{padding:8px 22px 17px}.schedule-item{min-height:99px;display:grid;grid-template-columns:68px 17px 1fr;gap:12px;padding:16px 0 12px}.time{padding-top:2px;color:#777f76;font-size:12px;font-weight:600}.timeline{position:relative;display:flex;justify-content:center}.timeline::after{content:"";position:absolute;top:13px;bottom:-20px;width:1px;background:#e7ebe5}.schedule-item:last-child .timeline::after{display:none}.dot{position:relative;z-index:1;width:10px;height:10px;margin-top:4px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #76a180;background:#76a180}.schedule-item:nth-child(2) .dot{background:#d6a879;box-shadow:0 0 0 2px #d6a879}.schedule-item:nth-child(3) .dot{background:#9b90c0;box-shadow:0 0 0 2px #9b90c0}
.event-card{padding:12px 14px;border:1px solid #edf0e9;border-radius:11px;background:#fcfcfa}.event-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.event-title{margin:0;font-size:14px;font-weight:700}.event-time{flex:0 0 auto;color:var(--muted);font-size:11px}.event-meta{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:7px;color:var(--muted);font-size:11px}.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:var(--green-soft);border-radius:20px;color:var(--green-dark);font-size:10px;font-weight:650;white-space:nowrap}.schedule-item:nth-child(2) .tag{background:var(--peach);color:#966a43}.schedule-item:nth-child(3) .tag{background:var(--lavender);color:#71668f}
.tasks-panel .panel-header{min-height:75px}.task-progress{color:var(--green);font-size:12px;font-weight:700}.task-list{padding:4px 21px 7px}.task{display:flex;align-items:flex-start;gap:11px;padding:16px 0;border-bottom:1px solid #f0f1ed}.task:last-child{border-bottom:0}.task input[type="checkbox"]{appearance:none;flex:0 0 auto;width:18px;height:18px;margin:1px 0 0;border:1.5px solid #d4d9d1;border-radius:6px;cursor:pointer;transition:background .15s,border .15s}.task input[type="checkbox"]:checked{border-color:var(--green);background:var(--green)}.task input[type="checkbox"]:checked::after{content:"✓";display:block;color:white;font-size:12px;text-align:center;line-height:16px}.task-copy{min-width:0;flex:1}.task-name{margin:0;font-size:13px;font-weight:650;line-height:1.55}.task-detail{margin:4px 0 0;color:var(--muted);font-size:11px}.task-status{flex:0 0 auto;margin-top:1px;padding:4px 7px;border-radius:6px;background:var(--yellow);color:#967c36;font-size:10px}.task.done .task-name{color:#929990;text-decoration:line-through}.task.done .task-status{background:var(--green-soft);color:var(--green)}
.task-footer{padding:13px 21px 17px;border-top:1px solid var(--line)}.add-task{width:100%;padding:9px 10px;border:1px dashed #d9dfd6;border-radius:9px;background:transparent;color:var(--green);font-size:12px;font-weight:650;cursor:pointer}.add-task:hover{background:var(--green-soft)}.bottom-note{display:flex;align-items:center;justify-content:space-between;padding:17px 4px 0;color:#92988f;font-size:11px}.bottom-note strong{color:var(--green);font-weight:650}
.toast{position:fixed;left:50%;bottom:24px;z-index:5;transform:translate(-50%,15px);opacity:0;padding:11px 17px;background:#29372d;color:#fff;border-radius:10px;box-shadow:var(--shadow);pointer-events:none;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:760px){.topbar{height:65px;padding:0 20px}.top-date{display:none}main{width:min(calc(100% - 32px),560px);padding-top:28px}.welcome{align-items:flex-start;gap:14px}.primary-button{padding:10px 12px;font-size:12px;white-space:nowrap}.stats{gap:9px}.stat-card{gap:9px;padding:13px 11px}.stat-icon{width:34px;height:34px;font-size:16px}.stat-value{font-size:17px}.stat-label{font-size:10px}.content-grid{grid-template-columns:1fr}.bottom-note{gap:12px}}
<body><header class="topbar"><div class="brand"><span class="brand-mark">◷</span><select id="languageSelect" aria-label="Change language"><option value="zh">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select></div><button class="tool-button" id="exportData">匯出 JSON 備份</button></header>
<script>
function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.title=t('title');$('languageSelect').value=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));const [y,m,d]=selectedDate.split('-').map(Number),day=new Date(y,m-1,d),locale=lang==='zh'?'zh-TW':lang==='ja'?'ja-JP':'en-US';$('datePicker').value=selectedDate;$('dateLabel').textContent=new Intl.DateTimeFormat(locale,{year:'numeric',month:'short',day:'numeric',weekday:'short'}).format(day)+(day.toDateString()===new Date().toDateString()?' · '+t('today'):'');const list=events.filter(e=>e.date===selectedDate).sort((a,b)=>a.start.localeCompare(b.start));$('eventCountValue').innerHTML=`${list.length} <small>${t('unit')}</small>`;$('schedule').innerHTML=list.length?list.map(e=>`<article class="schedule-item"><time class="time">${esc(e.start)}</time><span class="timeline"><span class="dot"></span></span><div class="event-card"><div class="event-top"><h3 class="event-title">${esc(e.titleKey?t(e.titleKey):e.title)}</h3><span class="event-time">${esc(e.start)} – ${esc(e.end)}</span></div><div class="event-meta">${e.locationKey?t(e.locationKey):e.location?esc(e.location):''}<span class="tag">${t(e.category==='work'?'work':'personal')}</span><button class="tool-button" data-delete="${esc(e.id)}">${t('delete')}</button></div></div></article>`).join(''):`<p class="schedule-empty">${t('empty')}</p>`;$('schedule').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm(t('delConfirm'))){events=events.filter(e=>e.id!==b.dataset.delete);save();render()}});$('taskList').innerHTML=tasks.map(x=>`<label class="task ${x.done?'done':''}"><input type="checkbox" data-task="${esc(x.id)}" ${x.done?'checked':''}><span class="task-copy"><p class="task-name">${x.titleKey?t(x.titleKey):esc(x.title)}</p></span><span class="task-status">${t(x.done?'done':'pending')}</span></label>`).join('');const done=tasks.filter(x=>x.done).length;$('taskSummary').textContent=`${done} / ${tasks.length}`;$('taskProgress').textContent=`${done} / ${tasks.length}`;$('taskList').querySelectorAll('[data-task]').forEach(input=>input.onchange=()=>{tasks.find(x=>x.id===input.dataset.task).done=input.checked;save();render()})}
$('exportData').onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify({version:1,events,tasks,lang},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='planner-data.json';a.click();URL.revokeObjectURL(a.href);notify(t('exported'))};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.events)||!Array.isArray(data.tasks))throw Error();events=data.events;tasks=data.tasks;if(I[data.lang])lang=data.lang;save();render();notify(t('imported'))}catch{notify(t('badFile'))}e.target.value=''};
try{const data=JSON.parse(localStorage.getItem('planner-v1'));if(data&&Array.isArray(data.events)&&Array.isArray(data.tasks)){events=data.events;tasks=data.tasks;if(I[data.lang])lang=data.lang}}catch{}render();
</script></body></html>

function shiftDate(offset){const [y,m,d]=selectedDate.split('-').map(Number),x=new Date(y,m-1,d+offset);selectedDate=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;render()}
$('languageSelect').onchange=()=>{lang=$('languageSelect').value;save();render()};$('prevDay').onclick=()=>shiftDate(-1);$('nextDay').onclick=()=>shiftDate(1);$('datePicker').onchange=()=>{if($('datePicker').value){selectedDate=$('datePicker').value;render()}};
$('addEvent').onclick=()=>{$('eventForm').reset();$('eventDate').value=selectedDate;$('eventDialog').showModal()};$('cancelEvent').onclick=()=>$('eventDialog').close();$('eventForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),start=f.get('start'),end=f.get('end');if(end<=start){notify(t('badTime'));return}events.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:f.get('date'),start,end,title:f.get('title').trim(),location:f.get('location').trim(),category:f.get('category')});selectedDate=f.get('date');save();$('eventDialog').close();render();notify(t('saved'))};
$('addTask').onclick=()=>{const title=prompt(lang==='ja'?'タスクを入力してください':lang==='en'?'Enter a task':'請輸入待辦事項');if(!title?.trim())return;tasks.push({id:String(Date.now()),title:title.trim(),done:false});save();render()};

const I={zh:{title:'個人行程與任務管理系統',tagline:'把重要的事安排好，讓每一天都從容一點。',addEvent:'＋ 新增行程',eventCount:'今日行程',tasks:'今日待辦',focus:'今日專注',hours:'小時規劃',schedule:'今日行程',scheduleSub:'把握每個重要時刻',tasksSub:'一步一步，完成今天的小目標',addTask:'＋ 新增一項待辦',newEvent:'新增行程',name:'行程名稱',date:'日期',start:'開始時間',end:'結束時間',location:'地點（選填）',category:'類別',personal:'個人安排',work:'工作會議',cancel:'取消',save:'儲存行程',import:'匯入 JSON 備份',export:'匯出 JSON 備份',footer:'今天也為自己留一點喘息的時間 ☁',today:'今天',unit:'個安排',done:'已完成',pending:'待完成',empty:'這天還沒有行程。',delete:'刪除',delConfirm:'確定刪除這筆行程嗎？',badTime:'結束時間必須晚於開始時間。',saved:'行程已新增並儲存。',exported:'已匯出 JSON 備份。',imported:'已匯入備份。',badFile:'備份檔格式不正確。',coffee:'晨間規劃與咖啡時光',meeting:'產品設計週會',shopping:'採買生活用品',locCoffee:'日光咖啡・中山店',locMeeting:'會議室 A／線上會議',locShopping:'誠品生活南西',taskMeeting:'整理本週會議重點',taskDesign:'寄出設計稿給團隊確認',taskDentist:'預約下週牙醫回診'},
en:{title:'Personal Schedule & Task Manager',tagline:'Plan what matters and make every day feel a little easier.',addEvent:'＋ Add event',eventCount:"Today's events",tasks:"Today's tasks",focus:'Focus time',hours:'hours planned',schedule:"Today's schedule",scheduleSub:'Make time for what matters',tasksSub:'One step at a time, one goal at a time',addTask:'＋ Add a task',newEvent:'Add event',name:'Event name',date:'Date',start:'Start time',end:'End time',location:'Location (optional)',category:'Category',personal:'Personal',work:'Work meeting',cancel:'Cancel',save:'Save event',import:'Import JSON backup',export:'Export JSON backup',footer:'Remember to leave a little room to breathe ☁',today:'Today',unit:'events',done:'Completed',pending:'Pending',empty:'Nothing scheduled for this day.',delete:'Delete',delConfirm:'Delete this event?',badTime:'End time must be later than start time.',saved:'Event saved.',exported:'JSON backup exported.',imported:'Backup imported.',badFile:'Invalid backup file.',coffee:'Morning planning & coffee',meeting:'Product design weekly sync',shopping:'Pick up household essentials',locCoffee:'Daylight Café · Zhongshan',locMeeting:'Meeting Room A / Online',locShopping:'Eslite Spectrum Nanxi',taskMeeting:'Organize this week’s meeting notes',taskDesign:'Send the design draft to the team',taskDentist:'Book next week’s dentist appointment'},
ja:{title:'個人スケジュール・タスク管理システム',tagline:'大切な予定を整えて、毎日をもっと心地よく。',addEvent:'＋ 予定を追加',eventCount:'今日の予定',tasks:'今日のタスク',focus:'集中時間',hours:'時間を計画',schedule:'今日の予定',scheduleSub:'大切な時間を有効に使いましょう',tasksSub:'一歩ずつ、今日の目標を達成しましょう',addTask:'＋ タスクを追加',newEvent:'予定を追加',name:'予定名',date:'日付',start:'開始時間',end:'終了時間',location:'場所（任意）',category:'カテゴリー',personal:'個人の予定',work:'仕事の会議',cancel:'キャンセル',save:'予定を保存',import:'JSON バックアップを読込',export:'JSON バックアップを書出',footer:'今日もひと息つく時間を忘れずに ☁',today:'今日',unit:'件',done:'完了',pending:'未完了',empty:'この日の予定はありません。',delete:'削除',delConfirm:'この予定を削除しますか？',badTime:'終了時間は開始時間より後にしてください。',saved:'予定を保存しました。',exported:'JSON バックアップを書き出しました。',imported:'バックアップを読み込みました。',badFile:'バックアップファイルが正しくありません。',coffee:'朝の予定確認とコーヒー',meeting:'プロダクトデザイン週次会議',shopping:'日用品の買い出し',locCoffee:'日光カフェ・中山店',locMeeting:'会議室 A／オンライン',locShopping:'誠品生活 南西',taskMeeting:'今週の会議メモを整理する',taskDesign:'デザイン案をチームに送る',taskDentist:'来週の歯科予約を取る'}};
const seeds=[{id:'coffee',date:'2026-10-16',start:'09:00',end:'10:00',titleKey:'coffee',locationKey:'locCoffee',category:'personal'},{id:'meeting',date:'2026-10-16',start:'11:00',end:'12:30',titleKey:'meeting',locationKey:'locMeeting',category:'work'},{id:'shopping',date:'2026-10-16',start:'15:00',end:'16:00',titleKey:'shopping',locationKey:'locShopping',category:'personal'}];
let lang='zh',selectedDate='2026-10-16',events=[...seeds],tasks=[{id:'meeting',titleKey:'taskMeeting',done:true},{id:'design',titleKey:'taskDesign',done:false},{id:'dentist',titleKey:'taskDentist',done:false}];const $=id=>document.getElementById(id),t=key=>I[lang][key]||I.zh[key]||key;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem('planner-v1',JSON.stringify({version:1,events,tasks,lang}))}catch(e){notify('Local storage unavailable; export a JSON backup.')}}function notify(message){const el=$('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}

<main><section class="welcome"><div><p class="eyebrow">PERSONAL PLANNER</p><h1 data-i="title">個人行程與任務管理系統</h1><p class="subtitle" data-i="tagline">把重要的事安排好，讓每一天都從容一點。</p></div><button class="primary-button" id="addEvent" data-i="addEvent">＋ 新增行程</button></section>
<section class="stats"><article class="stat-card"><span class="stat-icon green">▦</span><div><p class="stat-label" data-i="eventCount">今日行程</p><p class="stat-value" id="eventCountValue">3</p></div></article><article class="stat-card"><span class="stat-icon peach">✓</span><div><p class="stat-label" data-i="tasks">待辦事項</p><p class="stat-value" id="taskSummary">1 / 3</p></div></article><article class="stat-card"><span class="stat-icon lavender">☼</span><div><p class="stat-label" data-i="focus">今日專注</p><p class="stat-value">6.5 <small data-i="hours">小時規劃</small></p></div></article></section>
